version: "0.1"

agent:
  name: "health-checker"
  version: "0.1.0"
  description: "Checks URL health and reports status via HAP events"

credentials:
  optional:
    - name: URL_TO_CHECK
      description: "URL to monitor (defaults to https://example.com when unset)"

activation:
  mode: "continuous"

reporting:
  default: "stdout"
