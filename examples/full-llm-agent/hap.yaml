hap: "0.2"
agent:
  name: support-agent
  version: 2.0.0
  description: Resolves support requests using implementation-selected tools.
  author: HAP Team
  license: Apache-2.0
  tags: [support, triage]
capabilities:
  - id: resolve-ticket
    description: Investigates and resolves a support ticket.
  - id: answer-query
    description: Answers a support question.
credentials:
  - id: support-api
    required: true
    methods: [bearer, workload_identity]
    description: Credential for the configured support system.
lifecycle:
  health: supported
  cancellation: best_effort
  graceful_shutdown: supported
  max_concurrent_runs: 16
interfaces:
  - id: stream
    type: websocket
    endpoint: wss://agents.example.com/support
    credentials: [support-api]
  - id: a2a
    type: a2a
    endpoint: https://agents.example.com/a2a
    version: "1.0"
    credentials: [support-api]
